name: discover
on: workflow_dispatch
jobs:
  discover:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ano: [2023, 2024]
    steps:
      - name: Baixar e inspecionar
        run: |
          set -x
          url=https://download.inep.gov.br/microdados/microdados_enem_${{ matrix.ano }}.zip
          curl -sSIL "$url" | head -20 || true
          curl -fL --retry 5 --retry-delay 10 -o enem.zip "$url" || curl -fkL --retry 5 -o enem.zip "$url"
          ls -la enem.zip
          unzip -l enem.zip
          mkdir out
          for f in $(unzip -Z1 enem.zip | grep -iE '\.csv$'); do
            echo "=== $f"; unzip -p enem.zip "$f" | head -c 4000 | iconv -f latin1 -t utf8 | head -4
            echo "linhas: $(unzip -p enem.zip "$f" | wc -l)"
          done
          df -h . ; free -g
