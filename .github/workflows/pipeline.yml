name: pipeline
on:
  workflow_dispatch:
    inputs:
      anos:
        description: "Edições a processar (separadas por espaço)"
        default: "2023 2024"
  schedule:
    - cron: "17 9 1 * *"   # todo dia 1º: reprocessa (pega correções e edições novas)
permissions:
  contents: write
concurrency: pipeline
jobs:
  processar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements-pipeline.txt
      - name: Aquisição → tratamento → qualidade → agregação
        env:
          ANOS: ${{ github.event.inputs.anos || '2023 2024' }}
        run: |
          set -e
          for ano in $ANOS; do
            echo "::group::Enem $ano"
            python -m pipeline.aquisicao --ano $ano
            python -m pipeline.tratamento --ano $ano
            python -m pipeline.qualidade --ano $ano
            python -m pipeline.agregacao --ano $ano
            cp processed/tratamento_$ano.json data/$ano/tratamento.json
            cp raw/$ano/aquisicao.json data/$ano/aquisicao.json
            rm -rf raw/$ano/csv processed/enem_$ano.parquet
            echo "::endgroup::"
          done
      - name: Publicar dados agregados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "dados: atualização automática do pipeline"
          git push
